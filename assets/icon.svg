<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Deep Slate/Obsidian) -->
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Arrow Gradient (Neon Cyan/Blue) -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Terminal Gradient (Neon Purple/Pink) -->
    <linearGradient id="termGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Base Plate -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="#1e293b" stroke-width="6"/>

  <!-- Terminal ">_" -->
  <text x="35" y="165" font-family="Courier New, monospace" font-size="95" font-weight="bold" fill="url(#termGrad)">
    &gt;_
  </text>

  <!-- Sleek Download Arrow -->
  <path d="M190 60 v75 h24 l-38 52 l-38 -52 h24 v-75 z" fill="url(#arrowGrad)"/>
</svg>
